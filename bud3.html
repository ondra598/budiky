<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Budíku Xiaomi</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            background: #0066cc;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            box-sizing: border-box;
        }
        .alt { background: #28a745; }
    </style>
</head>
<body>

    <h2>Test budíku pro Xiaomi</h2>

    <!-- Varianta A: Cíleno na Google Hodiny -->
    <a class="btn" href="intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=7;i.android.intent.extra.alarm.MINUTES=30;s.android.intent.extra.alarm.MESSAGE=Test1;package=com.google.android.deskclock;end">
        1. Test (Google Hodiny)
    </a>

    <!-- Varianta B: Bez balíčku (Systém sám nabídne aplikaci) -->
    <a class="btn alt" href="intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=8;i.android.intent.extra.alarm.MINUTES=0;s.android.intent.extra.alarm.MESSAGE=Test2;end">
        2. Test (Univerzální - Výběr aplikace)
    </a>

</body>
</html>
